[[entries]]
date = "2026-09-09"
category = "Repository"
insight = "README is `README.md`; Obsidian source is `markdown/KI Impulse.md`; presentation is `docs/index.html`. Media live in `markdown/assets/` and `docs/assets/`; Markdown uses static WebP images and local audio embeds."
usefulness = 3

[[entries]]
date = "2026-09-15"
