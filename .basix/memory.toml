[[entries]]
date = "2026-09-10"
category = "Tooling"
insight = "For presentation browser checks, reuse Playwright in /tmp/ki-impulse-run/node_modules and browsers in /tmp/ki-impulse-playwright. Browser launch requires sandbox escalation; wait for hash navigation before screenshots."
usefulness = 0

[[entries]]
date = "2026-09-09"
category = "Repository"
insight = "The Obsidian note is `markdown/KI Impulse.md`; the browser presentation is `docs/index.html`. Markdown media live in `markdown/assets/`, with static WebP images and local audio embeds."
usefulness = 2

[[entries]]
date = "2026-09-09"
category = "User Instruction"
insight = "Do not expose internal theme rationale or implementation notes in the presentation content; keep slides audience-facing."
usefulness = 3

[[entries]]
date = "2026-09-09"
category = "Verification"
insight = "For scroll-snap slideshows, keep adjacent motion smooth but make Home, End, and distant hash jumps instant; observer-driven hash updates otherwise settle on intermediate slides."
usefulness = 2

[[entries]]
date = "2026-09-09"
category = "Verification"
insight = "For portable file-based slideshows, eagerly load slide images; lazy loading can appear as placeholders after direct hash navigation. Verify renamed media byte-for-byte against Markdown sources."
usefulness = 2

[[entries]]
date = "2026-09-09"
category = "User Instruction"
insight = "Keep the Neffe Thomas discussion question unresolved. Do not add explanations, spoiler hints, or explicit voice-cloning connections; the audience should discover and discuss the implication."
usefulness = 1
